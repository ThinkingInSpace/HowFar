<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Great Circle Guesser</title>

    <link rel="stylesheet" href="style.css">
    <!-- Globe.gl 3D WebGL Library -->
    <script src="https://unpkg.com/globe.gl"></script>
</head>
<body>

    <main id="game-container">
        
        <h1>🌍 Great Circle Guesser</h1>
        
        <!-- ROUND TRACKER & TIMER -->
        <div id="game-header">
            <h3>Round <span id="current-round">1</span> of 5</h3>
            <p>Total Score: <span id="current-score">0</span></p>
            <p id="timer-container" style="font-weight: bold; color: #e11d48;">⏱️ Time Left: <span id="timer-display">15</span>s</p>
        </div>

        <!-- QUESTION SECTION -->
        <div id="question-section">
            <p>What is the direct flight distance between:</p>
            <h2 id="location-text">Loading cities...</h2>
            
            <div>
                <input type="number" id="guess-input" placeholder="Enter distance..." min="0">
                <select id="unit-select">
                    <option value="km">Kilometers</option>
                    <option value="miles">Statute Miles</option>
                    <option value="nm">Nautical Miles</option>
                </select>
            </div>
            
            <button id="submit-btn">Submit Guess</button>
        </div>

        <!-- RESULT SECTION -->
        <div id="result-section" class="hidden">
            <h2 id="result-feedback">Good Guess!</h2>
            <p>Actual distance: <strong id="actual-distance">--</strong></p>
            <p>You guessed: <strong id="user-guess">--</strong></p>
            <p>Points earned: <strong id="round-points">0</strong> / 200</p>
            
            <!-- 3D Globe Container -->
            <div id="globeViz" style="height: 320px; width: 100%; margin-top: 15px; border-radius: 8px; overflow: hidden; background: #000;"></div>
            
            <button id="next-btn">Next Round</button>
        </div>

        <!-- END OF GAME SECTION -->
        <div id="summary-section" class="hidden">
            <h2>Game Over!</h2>
            <p>Your Final Score: <strong id="final-score">0</strong> / 1000</p>
            <p id="emoji-grid" style="font-size: 28px; letter-spacing: 4px; margin: 20px 0;"></p>
            
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button id="share-btn">Share Results 📋</button>
                <button id="play-again-btn" style="background-color: #4f46e5; color: white;">Play Again 🔄</button>
            </div>
        </div>

    </main>

    <script src="questions.js"></script>
    <script src="app.js"></script>
</body>
</html>
